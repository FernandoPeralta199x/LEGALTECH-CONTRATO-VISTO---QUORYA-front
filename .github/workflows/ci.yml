# DEP-07: pipeline versionado do frontend (lint, typecheck, testes, audit, build).
# O runner é externo (GitHub Actions), mas o pipeline passa a ser versionado por commit/PR.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 (alinha com o dev): o test runner (`node --test`) só expande globs como
          # `src/**/*.test.ts` a partir do Node 21 — o Node 20 tratava o glob como caminho
          # literal ("Could not find 'src/**/*.test.ts'") e o `npm test` falhava.
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Audita só as dependencias de PRODUCAO (o que e publicado) em nivel high+.
      # Vulns transitivas de ferramentas de build/dev (ex.: eslint -> minimatch ->
      # brace-expansion) nao vao para producao e so teriam fix quebrando o eslint
      # (major); ficam para upgrade periodico, sem bloquear o pipeline.
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
